<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regia Monza - POB Binzago</title>
<style>
:root{--bg:#07111d;--panel:#0e1d31;--muted:#9fb0c5;--green:#168a55;--danger:#b32037}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111d,#0b1728);color:#fff;font-family:Arial,Helvetica,sans-serif}.shell{max-width:1100px;margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}h1{font-size:20px;margin:0}.conn{font-size:13px;font-weight:800;color:#ffd166}.conn.ok{color:#5ee39d}.conn.bad{color:#ff7b8d}
.preview{display:grid;grid-template-columns:1fr 190px 1fr;border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 10px 28px rgba(0,0,0,.25)}.tp{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;min-width:0}.tp.home{background:linear-gradient(135deg,#e51e38,#981326);border-bottom:7px solid #fff}.tp.away{background:linear-gradient(135deg,#fff,#ededed);color:#a90f29;border-bottom:7px solid #b3132b}.nm{font-weight:950;font-size:18px;line-height:1.05}.nm span{display:block}.sc{font-size:46px;font-weight:950}.cp{background:#0b1728;display:grid;place-items:center;text-align:center}.prd{font-size:12px;font-weight:900}.clk{font-size:38px;font-weight:950}.sts{font-size:10px;font-weight:900;letter-spacing:1.2px;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:16px}.panel{background:rgba(14,29,49,.96);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.18)}.panel h2{margin:0 0 14px;font-size:16px}.home-panel h2{color:#ff97a5}.away-panel h2{color:#fff}.clock-panel h2{color:#b9d3ff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.label{font-size:13px;color:var(--muted);font-weight:800;min-width:80px}button{border:0;border-radius:10px;background:#1d3552;color:#fff;font-weight:900;padding:12px 14px;cursor:pointer;font-size:15px}button:hover{filter:brightness(1.12)}.scorebtn{min-width:58px;font-size:16px}.primary{background:var(--green);flex:1}.secondary{background:#203a5b}.danger{background:var(--danger)}.yellow{background:#8b7114}.wide{width:100%}input,select{background:#081522;color:#fff;border:1px solid #294664;border-radius:9px;padding:10px 11px;font-size:15px;font-weight:800}input[type=number]{width:82px}.clockbig{text-align:center;font-size:52px;font-weight:950;margin:8px 0 14px}.small{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.footer{margin-top:16px;display:flex;justify-content:space-between;gap:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{grid-template-columns:1fr 150px 1fr}}
</style></head><body><div class="shell"><div class="top"><h1>REGIA · PALLACANESTRO MONZA / POB BINZAGO</h1><div id="conn" class="conn">Connessione…</div></div>
<div class="preview"><div class="tp home"><div><div class="nm"><span>PALLACANESTRO</span><span>MONZA</span></div><div style="font-size:12px;margin-top:6px">FALLI <span id="pHF">0</span> · T.O. <span id="pHT">0</span></div></div><div class="sc" id="pHS">0</div></div><div class="cp"><div><div class="prd" id="pPeriod">1° QUARTO</div><div class="clk" id="pClock">10:00</div><div class="sts" id="pStatus">IN PAUSA</div></div></div><div class="tp away"><div class="sc" id="pAS">0</div><div style="text-align:right"><div class="nm"><span>POB</span><span>BINZAGO</span></div><div style="font-size:12px;margin-top:6px">FALLI <span id="pAF">0</span> · T.O. <span id="pAT">0</span></div></div></div></div>
<div class="grid"><section class="panel home-panel"><h2>PALLACANESTRO MONZA</h2><div class="row"><button class="scorebtn" onclick="add('homeScore',1)">+1</button><button class="scorebtn" onclick="add('homeScore',2)">+2</button><button class="scorebtn" onclick="add('homeScore',3)">+3</button><button class="scorebtn" onclick="add('homeScore',-1)">−1</button></div><div class="row"><span class="label">Falli</span><button onclick="add('homeFouls',-1)">−</button><button onclick="add('homeFouls',1)">+</button><strong id="homeFoulsVal">0</strong></div><div class="row"><span class="label">Timeout</span><button onclick="add('homeTimeouts',-1)">−</button><button onclick="add('homeTimeouts',1)">+</button><strong id="homeTimeoutsVal">0</strong></div></section>
<section class="panel clock-panel"><h2>CRONOMETRO</h2><div class="clockbig" id="bigClock">10:00</div><div class="row"><button id="toggleBtn" class="primary" onclick="toggleClock()">▶ Avvia</button><button class="secondary" onclick="resetClock()">↺ 10:00</button></div><div class="row"><span class="label">Imposta</span><input id="mins" type="number" min="0" max="99" value="10"><span>:</span><input id="secs" type="number" min="0" max="59" value="0"><button onclick="setClockFromInputs()">Imposta</button></div><div class="row"><span class="label">Quarto</span><select id="periodSelect" onchange="setPeriod(Number(this.value))"><option value="1">1° quarto</option><option value="2">2° quarto</option><option value="3">3° quarto</option><option value="4">4° quarto</option><option value="5">OT 1</option><option value="6">OT 2</option><option value="7">OT 3</option></select></div><button class="wide yellow" onclick="nextPeriod()">Quarto successivo →</button><div class="small"><b>Scorciatoia:</b> barra spaziatrice = avvia/pausa.</div></section>
<section class="panel away-panel"><h2>POB BINZAGO</h2><div class="row"><button class="scorebtn" onclick="add('awayScore',1)">+1</button><button class="scorebtn" onclick="add('awayScore',2)">+2</button><button class="scorebtn" onclick="add('awayScore',3)">+3</button><button class="scorebtn" onclick="add('awayScore',-1)">−1</button></div><div class="row"><span class="label">Falli</span><button onclick="add('awayFouls',-1)">−</button><button onclick="add('awayFouls',1)">+</button><strong id="awayFoulsVal">0</strong></div><div class="row"><span class="label">Timeout</span><button onclick="add('awayTimeouts',-1)">−</button><button onclick="add('awayTimeouts',1)">+</button><strong id="awayTimeoutsVal">0</strong></div></section></div>
<div class="footer"><button class="danger" onclick="newGame()">Nuova partita</button><button onclick="stopClock()">Ferma timer</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
const firebaseConfig = {
  apiKey: "AIzaSyAysJGD5jBnTEPY1lSlvk9yRfTXtyVZHwU",
  authDomain: "tabellone-monza-agrate-3f7a1.firebaseapp.com",
  databaseURL: "https://tabellone-monza-agrate-3f7a1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tabellone-monza-agrate-3f7a1",
  storageBucket: "tabellone-monza-agrate-3f7a1.firebasestorage.app",
  messagingSenderId: "1065515511910",
  appId: "1:1065515511910:web:c2939024b149145b4dbda7"
};
firebase.initializeApp(firebaseConfig); const db=firebase.database(); const ref=db.ref('scoreboards/monza-pob-binzago/live'); const D={homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,homeTimeouts:0,awayTimeouts:0,period:1,clock:600,running:false,startedAt:null}; let s={...D},off=0;
db.ref('.info/serverTimeOffset').on('value',x=>off=x.val()||0);db.ref('.info/connected').on('value',x=>{conn.textContent=x.val()?'● Firebase connesso':'● Non connesso';conn.className='conn '+(x.val()?'ok':'bad')});ref.transaction(x=>x||D).catch(err);ref.on('value',x=>{if(x.exists())s={...D,...x.val()};render()},err);
function err(e){console.error(e);conn.textContent='Errore Firebase: controlla le regole';conn.className='conn bad'} const now=()=>Date.now()+off;function rem(){let r=Number(s.clock??600);if(s.running&&s.startedAt)r-=Math.floor((now()-s.startedAt)/1000);return Math.max(0,r)}function fmt(v){v=Math.max(0,Math.floor(v));return `${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`}function pl(p){return p<=4?`${p}° QUARTO`:`OT ${p-4}`}
function render(){const r=rem();pHS.textContent=s.homeScore;pAS.textContent=s.awayScore;pHF.textContent=s.homeFouls;pAF.textContent=s.awayFouls;pHT.textContent=s.homeTimeouts;pAT.textContent=s.awayTimeouts;pPeriod.textContent=pl(Number(s.period||1));pClock.textContent=fmt(r);pStatus.textContent=s.running&&r>0?'IN CORSO':'IN PAUSA';bigClock.textContent=fmt(r);homeFoulsVal.textContent=s.homeFouls;awayFoulsVal.textContent=s.awayFouls;homeTimeoutsVal.textContent=s.homeTimeouts;awayTimeoutsVal.textContent=s.awayTimeouts;periodSelect.value=String(s.period||1);toggleBtn.textContent=s.running&&r>0?'❚❚ Pausa':'▶ Avvia';if(s.running&&r<=0)ref.update({clock:0,running:false,startedAt:null}).catch(err)} setInterval(render,200);
function add(f,d){ref.child(f).transaction(v=>Math.max(0,Number(v||0)+d)).catch(err)} async function toggleClock(){const r=rem();if(s.running)await ref.update({clock:r,running:false,startedAt:null}).catch(err);else if(r>0)await ref.update({clock:r,running:true,startedAt:firebase.database.ServerValue.TIMESTAMP}).catch(err)} function stopClock(){return ref.update({clock:rem(),running:false,startedAt:null}).catch(err)}function resetClock(){return ref.update({clock:600,running:false,startedAt:null}).catch(err)}function setClockFromInputs(){const m=Math.max(0,Number(mins.value||0)),q=Math.min(59,Math.max(0,Number(secs.value||0)));return ref.update({clock:m*60+q,running:false,startedAt:null}).catch(err)}function setPeriod(p){return ref.update({period:p,running:false,startedAt:null}).catch(err)}function nextPeriod(){const n=Math.min(7,Number(s.period||1)+1),dur=n<=4?600:300;return ref.update({period:n,clock:dur,running:false,startedAt:null,homeFouls:0,awayFouls:0}).catch(err)}function newGame(){if(confirm('Azzerare punteggio, falli, timeout, quarto e cronometro?'))return ref.set(D).catch(err)}document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggleClock()}});
</script></body></html>
